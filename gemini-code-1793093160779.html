<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Diwali Special Wish - Apne Naam Se Bhejein 🪔</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 215, 0, 0.4);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 30px rgba(255, 165, 0, 0.5);
            margin-top: 20px;
        }
        h1 {
            font-family: 'Rozha One', serif;
            color: #ffd700;
            font-size: 2.2rem;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #ffcc00;
            font-size: 1rem;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .diya-img {
            width: 110px;
            margin: 10px auto;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #ff4500); }
            to { filter: drop-shadow(0 0 22px #ffd700); }
        }
        .wish-box {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 18px;
            margin: 20px 0;
            border: 1px dashed #ffd700;
        }
        .wish-box p {
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .sender-name {
            color: #00ffcc;
            font-size: 2rem;
            font-weight: 700;
            margin: 12px 0;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.7);
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: 2px solid #ffd700;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            text-align: center;
            font-size: 1.05rem;
            outline: none;
            margin-bottom: 15px;
        }
        input[type="text"]::placeholder {
            color: #ddd;
        }
        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 14px 25px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.5);
            transition: 0.3s;
            margin-bottom: 10px;
        }
        .btn:hover {
            transform: scale(1.03);
        }

            background: linear-gradient(45deg, #25d366
